services:
  api:
    build: .
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["unbound-data:/app/data"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: .
    command: ["python", "-m", "unbound.worker"]
    env_file: .env
    volumes: ["unbound-data:/app/data"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
volumes:
  unbound-data:
