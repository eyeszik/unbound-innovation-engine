[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "unbound-innovation-engine"
version = "0.1.0"
description = "Persistent, evidence-qualified innovation orchestration"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "pydantic-settings>=2.6,<3", "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4", "langchain-openai>=1,<2", "langchain-anthropic>=1,<2", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "playwright>=1.48,<2"]

[project.scripts]
unbound-worker = "unbound.worker:main"

[tool.setuptools.package-data]
unbound = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["unbound*"]
